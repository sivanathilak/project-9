
<h2>Project 3 - Add Customer</h2>

<form (ngSubmit)="addCustomer()">

  <div>
    <label>First Name:</label>
    <input
      type="text"
      name="firstName"
      [(ngModel)]="firstName"
      required
    />
  </div>

  <div>
    <label>Last Name:</label>
    <input
      type="text"
      name="lastName"
      [(ngModel)]="lastName"
      required
    />
  </div>

  <div>
    <label>Email:</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      required
    />
  </div>

  <div>
    <label>Phone:</label>
    <input
      type="tel"
      name="phone"
      [(ngModel)]="phone"
      required
    />
  </div>

  <button type="submit">Add Customer</button>

</form>
